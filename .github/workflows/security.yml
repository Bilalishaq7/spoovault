name: "Security Static Analysis"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write # Required for SARIF upload

jobs:
  solidity-security:
    name: Solidity Analysis (Slither & Mythril)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        id: slither
        continue-on-error: true # Upload SARIF even if findings exist
        with:
          sarif: results.sarif
          fail-on: medium # Fails CI on High/Medium findings
          node-version: "22"

      - name: Upload Slither results to GitHub Security
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: slither

      - name: Fail if Slither reported high/medium findings
        if: steps.slither.outcome == 'failure'
        run: |
          echo "Slither failed (high/medium findings or analysis error)."
          exit 1

      - name: Run Mythril
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/tmp mythril/myth analyze /tmp/contracts/SpooVault.sol --execution-timeout 60

  rust-stellar-security:
    name: Soroban Analysis (Audit, Clippy, Geiger)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts-stellar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Security Tools
        run: |
          cargo install cargo-audit
          cargo install cargo-geiger

      - name: Run Cargo Audit
        run: cargo audit --file Cargo.lock
        # Advisory ignores for pinned soroban-sdk 20 transitive deps live in
        # contracts-stellar/.cargo/audit.toml


      - name: Run Cargo Clippy
        run: cargo clippy -- -D warnings

      - name: Run Cargo Geiger
        run: cargo geiger || true

      - name: Upload Geiger SARIF
        if: always() && hashFiles('contracts-stellar/geiger-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./contracts-stellar/geiger-results.sarif
          category: cargo-geiger
