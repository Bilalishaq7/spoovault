name: Fuzzing Suite (Echidna / Medusa / Soroban)

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  echidna:
    name: Echidna (Solidity property fuzzing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (for OpenZeppelin imports)
        run: npm install --legacy-peer-deps

      - name: Run Echidna campaign
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            trailofbits/echidna:v2.2.3 \
            sh -c "python -m pip install --quiet --upgrade solc-select 2>/dev/null; solc-select install 0.8.24 && solc-select use 0.8.24 && echidna /src/fuzz/harness/SpooVaultFuzz.sol --contract SpooVaultFuzz --config /src/fuzz/echidna/config.yaml --test-mode property"

  medusa:
    name: Medusa (Solidity invariant fuzzing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Medusa (build from source, v0.1.8)
        continue-on-error: true
        # `go install pkg@version` refuses modules that carry `replace`
        # directives (medusa v0.1.8 replaces go-ethereum with medusa-geth),
        # so we clone the tagged source and build it directly. The `main`
        # package lives at the repo root (not ./cmd/medusa).
        run: |
          git clone --depth 1 --branch v0.1.8 https://github.com/crytic/medusa /tmp/medusa
          cd /tmp/medusa
          go build -o /usr/local/bin/medusa .
          medusa --version

      - name: Install dependencies (for OpenZeppelin imports)
        run: npm install --legacy-peer-deps

      - name: Run Medusa campaign
        continue-on-error: true
        run: |
          export PATH="$HOME/go/bin:$PATH"
          medusa fuzz --config fuzz/medusa/medusa.toml

  soroban-fuzz:
    name: Soroban proptest (cargo-fuzz / proptest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts-stellar/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts-stellar/Cargo.lock') }}

      - name: Format (Soroban crate)
        working-directory: contracts-stellar
        run: cargo fmt

      - name: Run Soroban contract test suite
        working-directory: contracts-stellar
        run: cargo test
